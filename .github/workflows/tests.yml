name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q
      - name: Smoke test uvicorn startup
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/equipment-sets > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser walk-through against a real server
        run: |
          export COFFEE_LOG_DB_PATH="$RUNNER_TEMP/e2e.db"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:8001/equipment-sets > /dev/null && break
            sleep 0.5
          done
          E2E_BASE_URL=http://127.0.0.1:8001 python -m pytest -q tests/e2e
