{% extends "base.html" %}
{% block title %}器具セットを{{ "編集" if equipment_set else "登録" }}{% endblock %}
{% block content %}
<h1>器具セットを{{ "編集" if equipment_set else "登録" }}</h1>
<form id="equipment-form">
    <label>名前 <input name="name" required value="{{ equipment_set.name if equipment_set else '' }}"></label>
    <label>ドリッパー <input name="brewer_label" required value="{{ equipment_set.brewer_label if equipment_set else '' }}"></label>
    <label>フィルター <input name="filter_label" required value="{{ equipment_set.filter_label if equipment_set else '' }}"></label>
    <label>ミル <input name="grinder_label" required value="{{ equipment_set.grinder_label if equipment_set else '' }}"></label>
    <label>挽き目の単位
        <select name="grind_setting_unit" required>
            {% for value in ["click", "step", "number", "other"] %}
            <option value="{{ value }}" {% if equipment_set and equipment_set.grind_setting_unit == value %}selected{% endif %}>{{ value }}</option>
            {% endfor %}
        </select>
    </label>
    <label>メモ <textarea name="note">{{ equipment_set.note if equipment_set and equipment_set.note else '' }}</textarea></label>
    <button type="submit">保存</button>
</form>
{% endblock %}

{% block script %}
<script>
const form = document.getElementById("equipment-form");
const equipmentSetId = {{ equipment_set.id if equipment_set else "null" }};

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const fields = form.elements;
    const payload = {
        name: fields.name.value,
        brewer_label: fields.brewer_label.value,
        filter_label: fields.filter_label.value,
        grinder_label: fields.grinder_label.value,
        grind_setting_unit: fields.grind_setting_unit.value,
        note: textOrNull(fields.note.value),
    };
    const saved = await sendJson(
        equipmentSetId ? "PATCH" : "POST",
        equipmentSetId ? `/equipment-sets/${equipmentSetId}` : "/equipment-sets",
        payload,
    );
    if (saved) window.location.href = "/pages/equipment-sets";
});
</script>
{% endblock %}
